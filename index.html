<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joe Anni Jeffia Portfolio</title>

<style>

html{
    scroll-behavior:smooth;
}

body {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    background-color: #0b2479;
}

.nav {
    width: 100%;
    height: 65px;
    position: fixed;
    line-height: 65px;
    text-align: center;
    z-index: 1000;
}

.nav div.logo {
    float: left;
    padding-left: 3rem;
}

.nav div.logo a {
    text-decoration: none;
    color: #fff;
    font-size: 2rem;
}

.nav div.main_list {
    float: right;
}

.nav div.main_list ul {
    display: flex;
    list-style: none;
    margin: 0;
}

.nav div.main_list ul li {
    padding-right: 3rem;
}

.nav div.main_list ul li a {
    text-decoration: none;
    color: white;
    font-size: 1.4rem;
}

.nav div.main_list ul li a:hover {
    color: #00E676;
}

.affix {
    background-color: #111;
}

.home {
    width: 100%;
    height: 100vh;
    background-image: url("https://images.unsplash.com/photo-1498550744921-75f79806b8a7?auto=format&fit=crop&w=1500&q=80");
    background-size: cover;
    background-position: center;
}

.myH2 {
    text-align: center;
    color: white;
    padding-top: 300px;
    font-size: 3rem;
}

.showcase {
    padding: 50px;
}

.containe {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
}

.item {
    background: white;
    padding: 15px;
    border-radius: 10px;
}

.item img {
    width: 300px;
    height: 250px;
}

figcaption {
    text-align: center;
    color: black;
    font-size: 1.2rem;
    margin-top: 10px;
}

footer {
    background: black;
    color: white;
    text-align: center;
    padding: 20px;
}

@media(max-width:768px){

    .nav div.main_list ul{
        flex-direction:column;
    }

    .item img{
        width:250px;
        height:200px;
    }
}

</style>
</head>

<body>

<nav class="nav">
    <div class="logo">
        <a href="#">
            <img src="https://st.hzcdn.com/simgs/d69316f80cc2f9e6_3-2945/_.jpg" width="100" height="80">
        </a>
    </div>

    <div class="main_list">
        <ul>
            <li><a href="about.html">About</a></li>
            <li><a href="#portfolio">Portfolio</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </div>
</nav>

<section class="home">
    <h2 class="myH2">Hello, I'm Joe Anni Jeffia</h2>
</section>

<section class="showcase" id="portfolio">

<div class="containe">

<div class="item">
<a href="#">
<img src="https://media.istockphoto.com/id/1299755243/vector/creative-idea-line-icon-lump-with-gear-icon-brain-in-lightbulb-vector-illustration-thin-sign.jpg?s=612x612&w=0&k=20&c=CaqnVEqz2RqzbqoEGhU8UBFMTBGWHa1zROXrtTtlH_I=">
</a>
<figcaption>Skillset</figcaption>
</div>

<div class="item">
<a href="#">
<img src="https://media.istockphoto.com/id/1331164793/vector/study-championship-logo-template-design.jpg?s=612x612&w=0&k=20&c=7QClXetCt90IySTsOVBWPzEqWL6TWxAwRQnFmhNNsbM=">
</a>
<figcaption>Achievements</figcaption>
</div>

<div class="item">
<a href="#">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0QQlH1LylSFN5PS9L_6kAw-nWth5KQvA-Ug&s">
</a>
<figcaption>Hobbies</figcaption>
</div>

</div>

</section>

<footer>
    <p>Joe's Portfolio © 2026</p>
</footer>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script>
$(window).scroll(function() {
    if ($(document).scrollTop() > 50) {
        $('.nav').addClass('affix');
    } else {
        $('.nav').removeClass('affix');
    }
});
</script>

</body>
</html>
